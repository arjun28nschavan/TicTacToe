<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tic Tac Toe – Neon Pro</title>

  <!-- BOOTSTRAP CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-dark">

  <!-- Winner Modal (Confetti Popup style) -->
  <div class="modal fade" id="winnerModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-transparent border-0">
        <div class="modal-body text-center">
          <div class="popup-card p-4 rounded-3">
            <h2 id="winnerText" class="mb-3"></h2>
            <button class="btn btn-light" id="new-btn">New Game</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Background Music (Arcade loop) -->
  <audio id="bg-music" loop>
    <!-- Arcade-style loop (works in most browsers) -->
    <source src="https://assets.mixkit.co/music/preview/mixkit-arcade-retro-2042.mp3" type="audio/mpeg">
    <!-- Fallback short sound -->
    <source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg">
  </audio>

  <div class="container text-center mt-5">

    <h1 class="text-neon mb-3 fw-bold">Tic Tac Toe</h1>

    <div class="mb-3 d-flex justify-content-center gap-2">
      <!-- Music Button -->
      <button id="music-btn" class="btn btn-info">🔊 Music</button>

      <!-- Play vs Computer toggle -->
      <div class="form-check form-switch align-self-center ms-2">
        <input class="form-check-input" type="checkbox" id="aiToggle">
        <label class="form-check-label text-light" for="aiToggle">Play vs Computer</label>
      </div>
    </div>

    <!-- Message Container -->
    <div id="msgContainer" class="hide">
      <p id="msg"></p>
    </div>

    <!-- Game Grid -->
    <div class="d-flex justify-content-center">
      <div class="game-grid">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
      </div>
    </div>

    <!-- Reset Button -->
    <button id="reset-btn" class="btn btn-danger mt-4 px-4 py-2">Reset Game</button>

  </div>

  <!-- Confetti library -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Main JS -->
  <script src="script.js"></script>
</body>
</html>
